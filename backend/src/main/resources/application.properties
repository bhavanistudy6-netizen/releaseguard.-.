spring.application.name=releaseguard

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/releaseguard}
spring.datasource.username=${DB_USERNAME:releaseguard}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Trust forwarded headers from Nginx ingress reverse proxy
server.forward-headers-strategy=framework

# Server-side Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=RELEASEGUARD_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Security Bootstrap Configuration
security.initial-admin.username=${SECURITY_INITIAL_ADMIN_USERNAME:admin}
security.initial-admin.password=${SECURITY_INITIAL_ADMIN_PASSWORD:${INITIAL_ADMIN_PASSWORD:}}
security.seed-test-accounts=${SECURITY_SEED_TEST_ACCOUNTS:false}
security.test-accounts.password=${SECURITY_TEST_ACCOUNTS_PASSWORD:}
