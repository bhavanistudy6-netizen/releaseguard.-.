# SonarQube Scanner Configuration for ReleaseGuard
sonar.projectKey=releaseguard
sonar.projectName=ReleaseGuard
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx

# Java bytecode analysis
sonar.java.binaries=backend/target/classes

# Code Coverage Reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclusions (Generated files, build output, static test assets)
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/docs/**,**/*.json,**/*.svg,**/*.css
