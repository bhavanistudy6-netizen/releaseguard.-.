sonar.projectKey=releaseGuard
sonar.projectName=ReleaseGuard
sonar.sourceEncoding=UTF-8

# Application source and tests
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src

sonar.test.inclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx

# Keep frontend tests out of application source analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.test.ts,**/*.test.tsx

# Compiled Java classes
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Backend coverage and test results
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports